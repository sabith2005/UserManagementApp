<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Generator</title>
</head>

<body>

    <h1>Fibonacci Generator</h1>

    <button onclick="window.location.href='/users.html'">
        Back to User List
    </button>

    <hr>

    <h2>Generate Fibonacci Table</h2>

    <form id="fibonacciForm">

        <label for="rows">Rows:</label>
        <br>
        <input type="number"
               id="rows"
               min="1"
               max="50"
               required>

        <br><br>

        <label for="columns">Columns:</label>
        <br>
        <input type="number"
               id="columns"
               min="1"
               max="50"
               required>

        <br><br>

        <button type="submit">
            Generate
        </button>

    </form>

    <p id="message"></p>

    <br>

    <table id="fibonacciTable"
           border="1"
           cellpadding="10">
    </table>

    <script src="/fibonacci.js"></script>

</body>
</html>
