<!DOCTYPE html>
<html>
<head>
    <title>Add User</title>
</head>

<body>

    <h1>Add User</h1>

    <form id="addUserForm">

        <label for="name">Name:</label>
        <br>
        <input type="text"
               id="name"
               required>

        <br><br>

        <label for="email">Email:</label>
        <br>
        <input type="email"
               id="email"
               required>

        <br><br>

        <label for="password">Password:</label>
        <br>
        <input type="password"
               id="password"
               minlength="6"
               required>

        <br><br>

        <label for="status">Status:</label>
        <br>

        <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

        <br><br>

        <button type="submit">
            Save User
        </button>

        <button type="button"
                onclick="window.location.href='/users.html'">
            Cancel
        </button>

    </form>

    <p id="message"></p>

    <script src="/add-user.js"></script>

</body>
</html>
